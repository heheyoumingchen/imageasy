name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test
      - name: E2E smoke (frontend + release config)
        run: pnpm test:e2e
      - name: Production build
        run: pnpm build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tauri-build 的 build.rs 会校验 externalBin（渲染 helper）与
      # resources（pdfium/*）的 glob，二者均不入库，冷检出的 CI 需要先
      # 下载 pdfium 并构建 stage helper。
      - name: Download PDFium runtime (Windows x64)
        shell: bash
        run: |
          curl -fsSL -o pdfium-win-x64.tgz https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz
          mkdir pdfium-dist
          tar -xzf pdfium-win-x64.tgz -C pdfium-dist
          # Windows 包的 DLL 在 bin/（macOS 包在 lib/），stage 脚本按平台取对应文件名
          test -f pdfium-dist/bin/pdfium.dll
          echo "PDFIUM_BIN_DIR=$GITHUB_WORKSPACE/pdfium-dist/bin" >> "$GITHUB_ENV"
      - name: Stage PDFium and document renderer helper (sidecar)
        shell: bash
        run: |
          node scripts/stage-pdfium.mjs
          node scripts/ensure-sidecar.mjs
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
