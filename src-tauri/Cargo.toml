[package]
name = "imageasy"
version = "0.1.0"
description = "图片批量处理助手"
authors = ["heheyouchen"]
edition = "2021"

[lib]
name = "imageasy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "webp", "bmp"] }
jpeg-decoder = "0.3"
lopdf = "0.35"
pdfium-render = "0.8"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
tempfile = "3.15"
ureq = "2"
url = "2"
walkdir = "2.5"
rayon = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
webpx = { version = "0.4", default-features = false, features = ["encode", "std"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[features]
# 仅用于 conversion_benchmark 示例：编译可复现的性能证据采集代码。
benchmarking = []

[[example]]
name = "conversion_benchmark"
required-features = ["benchmarking"]

[[bin]]
name = "document-renderer-helper"
path = "src/bin/document_renderer_helper.rs"

[dev-dependencies]
